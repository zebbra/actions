name: Docker build with optional smart GHA cache, generic/custom tagging and labels
description: Build/push Docker image with configurable GHA cache, generic/custom tagging and labels
author: Zebbra AG

inputs:
  image_name:
    description: Fully qualified image name to tag/push (e.g., quay.io/org/app)
    required: true
  context:
    description: Build context
    default: .
  file:
    description: Dockerfile path
    default: ./Dockerfile
  target:
    description: Optional Docker build target (multi-stage target name)
  platforms:
    description: Optional platforms (comma-separated) for multi-arch builds
  push:
    description: |
      Push the built image to the registry (`true`/`false`).
      Requires at least one tag to be enabled/provided (e.g., `include_tag_sha`, `include_tag_ref`, `include_tag_latest`, `branch_tags_on_push`, or `tags`).
    default: 'false'
  load:
    description: |
      Load the built image into the local Docker daemon (`true`/`false`).
      Useful for local testing or when you need the image available locally after build.
      Note: Cannot be used together with multi-platform builds (`platforms` input).
    default: 'false'
  include_tag_sha:
    description: Include a tag based on the commit SHA (`true`/`false`).
    default: 'false'
  include_tag_ref:
    description: Include a tag based on the branch name (`true`/`false`).
    default: 'false'
  include_tag_latest:
    description: Include the `latest` tag (`true`/`false`).
    default: 'false'
  branch_tags_on_push:
    description: Automatically add `main`/`develop` tags on branch pushes when branch matches (`true`/`false`).
    default: 'false'
  tags:
    description: |
      Additional docker/metadata-action tag rules (multiline). Appended verbatim to the metadata-action `tags` input.
      Examples:
        `type=raw,value=1.2.3`
        `type=raw,value=one-tag-to-rule-them-all`
        `type=semver,pattern={{major}}.{{minor}}`
  description:
    description: Value for `org.opencontainers.image.description` label
  extra_labels:
    description: Extra labels (multiline `key=value`), appended verbatim
  quay_expires_after:
    description: Optional value for `quay.expires-after` label (e.g., `20d`). Leave empty to skip this label.
  semver:
    description: |
      Semver version string (e.g., "1.2.3" or "1.2.3-beta.1").
      Generates type=semver tags: {{version}}, {{major}}.{{minor}}, {{major}}.
      Prerelease versions automatically get only the full version tag
      (metadata-action natively suppresses major/minor for prereleases).
      Also auto-sets quay_expires_after=20d for prereleases unless explicitly overridden.
  semver_suffix:
    description: Suffix appended to all semver-generated tags (e.g., "-bullseye"). Uses metadata-action's suffix= attribute.
  build_args:
    description: Additional build-args (multiline `KEY=VALUE`), appended verbatim
  cache_from_overrides:
    description: Override `cache-from` lines (multiline). If set, skips `smart_cache`.
  cache_write_scope:
    description: Scope name for `cache-to` (defaults to current branch). Use to control where cache is written.
  cache_to_mode:
    description: "BuildKit cache-to mode (min|max)"
    default: "max"
  smart_cache:
    description: Enable smart `cache-from` heuristic (head, base, develop, main). Ignored if `cache_from_overrides` is provided.
    default: 'true'
  secrets:
    description: |
      Additional BuildKit secrets (one per line). Examples: `id=GIT_AUTH_TOKEN,env=GITHUB_TOKEN` or `id=mysecret,src=/path/to/file`

outputs:
  tags:
    description: Generated Docker image tags
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: Image digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Determine cache branches
      id: branches
      shell: bash
      run: |
        HEAD_BRANCH_RAW="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        BASE_BRANCH_RAW="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
        HEAD_BRANCH="${HEAD_BRANCH_RAW////-}"
        BASE_BRANCH="${BASE_BRANCH_RAW////-}"
        echo "head=${HEAD_BRANCH}" >> "$GITHUB_OUTPUT"
        echo "base=${BASE_BRANCH}" >> "$GITHUB_OUTPUT"

    - name: Compute Docker cache-from
      id: cache_from
      shell: bash
      run: |
        if [ -n "${{ inputs.cache_from_overrides }}" ]; then
          # Use overrides exactly as provided
          {
            echo "cache_from<<EOF"
            echo "${{ inputs.cache_from_overrides }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "${{ inputs.smart_cache }}" != "true" ]; then
          {
            echo "cache_from<<EOF"
            echo "type=gha,scope=develop"
            echo "type=gha,scope=main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        HEAD='${{ steps.branches.outputs.head }}'
        BASE='${{ steps.branches.outputs.base }}'
        if [ "$HEAD" = "main" ]; then
          echo "cache_from=type=gha,scope=main" >> "$GITHUB_OUTPUT"
        elif [ "$HEAD" = "develop" ]; then
          {
            echo "cache_from<<EOF"
            echo "type=gha,scope=develop"
            echo "type=gha,scope=main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "cache_from<<EOF"
            echo "type=gha,scope=${HEAD}"
            if [ "$BASE" != "$HEAD" ]; then echo "type=gha,scope=${BASE}"; fi
            echo "type=gha,scope=develop"
            echo "type=gha,scope=main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Docker meta (tags & labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.image_name }}
        tags: |
          type=sha,enable=${{ inputs.include_tag_sha == 'true' }}
          type=ref,event=branch,enable=${{ inputs.include_tag_ref == 'true' }}
          type=raw,value=latest,enable=${{ inputs.push == 'true' && inputs.include_tag_latest == 'true' }}
          type=raw,value=main,enable=${{ inputs.push == 'true' && inputs.branch_tags_on_push == 'true' && github.ref_type == 'branch' && steps.branches.outputs.head == 'main' }}
          type=raw,value=develop,enable=${{ inputs.push == 'true' && inputs.branch_tags_on_push == 'true' && github.ref_type == 'branch' && steps.branches.outputs.head == 'develop' }}
          type=semver,pattern={{version}},value=${{ inputs.semver }},suffix=${{ inputs.semver_suffix }},enable=${{ inputs.semver != '' }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.semver }},suffix=${{ inputs.semver_suffix }},enable=${{ inputs.semver != '' }}
          type=semver,pattern={{major}},value=${{ inputs.semver }},suffix=${{ inputs.semver_suffix }},enable=${{ inputs.semver != '' }}
          ${{ inputs.tags }}
        labels: |
          ${{ inputs.description != '' && format('org.opencontainers.image.description={0}', inputs.description) || '' }}
          ${{ inputs.extra_labels }}
          ${{ (inputs.quay_expires_after != '' && format('quay.expires-after={0}', inputs.quay_expires_after)) || (inputs.semver != '' && contains(inputs.semver, '-') && 'quay.expires-after=20d') || '' }}

    - name: Validate tags when pushing
      if: ${{ inputs.push == 'true' }}
      shell: bash
      run: |
        if [ -z "${{ steps.meta.outputs.tags }}" ]; then
          echo "Error: push=true but no tags were generated. Enable at least one tag input (include_tag_sha/include_tag_ref/include_tag_latest/branch_tags_on_push or provide custom tags)." >&2
          exit 1
        fi


    - name: Build (and maybe push)
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push == 'true' }}
        load: ${{ inputs.load == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: ${{ steps.cache_from.outputs.cache_from }}
        cache-to: type=gha,mode=${{ inputs.cache_to_mode }},scope=${{ inputs.cache_write_scope != '' && inputs.cache_write_scope || steps.branches.outputs.head }},ignore-error=true
        provenance: false
        build-args: ${{ inputs.build_args }}
        secrets: ${{ inputs.secrets }}


