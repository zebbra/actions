[project]
name = "dependency-audit"
version = "0.1.0"
description = "Audit uv and npm lockfiles for known vulnerabilities; gate PRs on new findings and refresh lockfiles."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dependency-audit = "dependency_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dependency_audit"]

[tool.pytest.ini_options]
markers = ["integration: runs the real uv or npm (skipped when the tool is absent)"]
