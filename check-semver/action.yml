name: "Check SemVer on Branch"
description: "This action ensures that semantic version tags are in correct chronological order."
author: "Zebbra AG"

inputs:
  allow_backports:
    description: |
      Enable branch-aware mode that allows backported releases across different
      major.minor series (e.g., v1.0.1 after v1.1.0). When false (default),
      strict global ordering is enforced.
    required: false
    default: 'false'

outputs:
  version:
    description: "Version number without 'v' prefix (e.g., '1.2.3')"
    value: ${{ steps.version.outputs.version }}
  major:
    description: "Major version number (e.g., '1')"
    value: ${{ steps.version.outputs.major }}
  minor:
    description: "Minor version number (e.g., '2')"
    value: ${{ steps.version.outputs.minor }}
  major_minor:
    description: "Major.minor version (e.g., '1.2')"
    value: ${{ steps.version.outputs.major_minor }}

runs:
  using: composite
  steps:
    - name: Skip semver check on non-tag refs
      if: ${{ github.ref_type != 'tag' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "SemVer check skipped: ref type '${GITHUB_REF_TYPE:-unknown}'"
        {
          echo "## Check SemVer"
          echo "⏭️ Skipped: Non-tag ref"
          echo ""
          echo "- Ref type: ${GITHUB_REF_TYPE:-unknown}"
          echo "- Ref name: ${GITHUB_REF_NAME:-unknown}"
          echo "- Validation runs only for tags."
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Checkout repository (full history)
      if: ${{ github.ref_type == 'tag' }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      if: ${{ github.ref_type == 'tag' }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      if: ${{ github.ref_type == 'tag' }}
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Check semver integrity
      if: ${{ github.ref_type == 'tag' }}
      shell: bash
      env:
        ALLOW_BACKPORTS: ${{ inputs.allow_backports }}
      run: python "${{ github.action_path }}/check-semver.py"

    - name: Calculate version tags
      id: version
      if: ${{ github.ref_type == 'tag' }}
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${GITHUB_REF_NAME#v}"
        MAJOR="${VERSION%%.*}"
        MINOR="${VERSION#*.}"
        MINOR="${MINOR%%.*}"
        MAJOR_MINOR="${VERSION%.*}"
        {
          echo "version=${VERSION}"
          echo "major=${MAJOR}"
          echo "minor=${MINOR}"
          echo "major_minor=${MAJOR_MINOR}"
        } >> $GITHUB_OUTPUT