name: "Check SemVer on Branch"
description: "This action ensures that semantic version tags are in correct chronological order."
author: "Zebbra AG"

inputs:
  fail_on_deleted:
    description: |
      When true (default), fail the workflow on tag deletion push events (e.g.
      `git push --delete origin v1.2.3`), while still reporting whether SemVer
      ordering is intact. When false, succeed on deletion events if SemVer order
      is intact.
    required: false
    default: 'true'

outputs:
  version:
    description: "Version number without 'v' prefix (e.g., '1.2.3')"
    value: ${{ steps.semver.outputs.version }}
  major:
    description: "Major version number (e.g., '1')"
    value: ${{ steps.semver.outputs.major }}
  minor:
    description: "Minor version number (e.g., '2')"
    value: ${{ steps.semver.outputs.minor }}
  major_minor:
    description: "Major.minor version (e.g., '1.2')"
    value: ${{ steps.semver.outputs.major_minor }}
  is_prerelease:
    description: "Whether the triggering tag is a prerelease version ('true' or 'false')"
    value: ${{ steps.semver.outputs.is_prerelease }}
  is_latest:
    description: "Whether the triggering tag is the highest stable semver tag ('true' or 'false')"
    value: ${{ steps.semver.outputs.is_latest }}

runs:
  using: composite
  steps:
    - name: Fail on non-tag refs
      if: ${{ github.ref_type != 'tag' }}
      shell: bash
      run: |
        set -euo pipefail
        REF_TYPE="${GITHUB_REF_TYPE:-unknown}"
        REF_NAME="${GITHUB_REF_NAME:-unknown}"
        echo "SemVer check requires a tag ref; got '${REF_TYPE}' (${REF_NAME})."
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "## Check SemVer"
            echo "🚫 Failed: Github ref is not a tag"
            echo "- Ref type: ${REF_TYPE}"
            echo "- Ref name: ${REF_NAME}"
            echo "- This action is only supported on tag refs. Please don't run it on any other refs (e.g. branches, pull requests, etc.)."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
        fi
        exit 1

    - name: Checkout repository (full history)
      if: ${{ github.ref_type == 'tag' && github.event.deleted != true }}
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout repository (full history; deleted tag event)
      if: ${{ github.ref_type == 'tag' && github.event.deleted == true }}
      uses: actions/checkout@v4
      with:
        # When a tag is deleted, the ref no longer exists, so we cannot check it out.
        # We check out the default branch instead to fetch tags and validate ordering.
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0

    - name: Setup Python
      if: ${{ github.ref_type == 'tag' }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      if: ${{ github.ref_type == 'tag' }}
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Check semver integrity
      id: semver
      if: ${{ github.ref_type == 'tag' }}
      shell: bash
      env:
        FAIL_ON_DELETED: ${{ inputs.fail_on_deleted }}
      run: python "${{ github.action_path }}/check-semver.py"