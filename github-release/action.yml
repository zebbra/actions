name: GitHub release (stable semver tags by default)
description: Create a GitHub Release for eligible tags (stable semver by default; optionally include beta tags).
author: Zebbra AG

inputs:
  release_beta_tags:
    description: |
      When `true`, also create releases for tags matching `vMAJOR.MINOR.PATCH-beta.N`.
      When `false` (default), only stable tags matching `vMAJOR.MINOR.PATCH` are released.
    required: false
    default: 'false'

outputs:
  should_release:
    description: Whether the action created (or will create) a GitHub Release for the current ref.
    value: ${{ steps.determine.outputs.should_release }}
  prerelease:
    description: Whether the release is marked as prerelease (only true for allowed beta tags).
    value: ${{ steps.determine.outputs.prerelease }}
  tag:
    description: The tag that was considered eligible for release.
    value: ${{ steps.determine.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Determine whether to create a release
      id: determine
      shell: bash
      env:
        STABLE_RE: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        BETA_RE: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$'
      run: |
        set -euo pipefail

        TAG="${GITHUB_REF_NAME}"
        RELEASE_BETA_TAGS='${{ inputs.release_beta_tags }}'

        SHOULD_RELEASE="false"
        PRERELEASE="false"
        OUT_TAG=""
        SKIP_REASON=""

        if [[ "$TAG" =~ $STABLE_RE ]]; then
          SHOULD_RELEASE="true"
          PRERELEASE="false"
          OUT_TAG="${TAG}"
        elif [[ "$TAG" =~ $BETA_RE ]]; then
          if [[ "$RELEASE_BETA_TAGS" == "true" ]]; then
            SHOULD_RELEASE="true"
            PRERELEASE="true"
            OUT_TAG="${TAG}"
          else
            SKIP_REASON="beta_disabled"
          fi
        fi

        if [[ "${SHOULD_RELEASE}" != "true" ]] && [[ -z "${SKIP_REASON}" ]]; then
          SKIP_REASON="ineligible_ref"
        fi

        {
          echo "should_release=${SHOULD_RELEASE}"
          echo "prerelease=${PRERELEASE}"
          echo "tag=${OUT_TAG}"
          echo "skip_reason=${SKIP_REASON}"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      if: ${{ steps.determine.outputs.should_release == 'true' }}
      id: release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.determine.outputs.tag }}
        generate_release_notes: true
        draft: false
        prerelease: ${{ steps.determine.outputs.prerelease == 'true' }}

    - name: Annotate result
      if: ${{ steps.determine.outputs.should_release != 'true' || steps.release.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail

        REF="${GITHUB_REF_NAME}"

        SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-}"

        if [[ '${{ steps.determine.outputs.should_release }}' == "true" ]]; then
          TAG='${{ steps.determine.outputs.tag }}'
          PRERELEASE='${{ steps.determine.outputs.prerelease }}'
          HTML_URL='${{ steps.release.outputs.html_url }}'

          if [[ -n "${SUMMARY_FILE}" ]]; then
            {
              echo "## 🚀 GitHub Release"
              echo
              echo "- Status: ✅ success"
              echo "- Tag: \`${TAG}\`"
              echo "- Prerelease: ${PRERELEASE}"
              if [[ -n "${HTML_URL}" ]]; then
                echo "- Release: [View release](${HTML_URL})"
              else
                echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
              fi
            } >> "${SUMMARY_FILE}"
          fi

          echo "::notice title=GitHub-Release: done::Created GitHub Release for ${TAG} (prerelease=${PRERELEASE})"
          exit 0
        fi

        SKIP_REASON='${{ steps.determine.outputs.skip_reason }}'

        if [[ "${SUMMARY_FILE}" != "" ]]; then
          {
            echo "## 🚀 GitHub Release"
            echo
            echo "- Status: ⚪ skipped"
          } >> "${SUMMARY_FILE}"
        fi

        if [[ "${SKIP_REASON}" == "beta_disabled" ]]; then
          if [[ "${SUMMARY_FILE}" != "" ]]; then
            {
              echo "- Reason: beta tag ignored because release_beta_tags=false"
              echo "- Tag: \`${REF}\`"
            } >> "${SUMMARY_FILE}"
          fi

          echo "::notice title=GitHub-Release: skipped (beta disabled)::Beta tag detected but release_beta_tags=false; skipping: ${REF}"
          exit 0
        fi

        if [[ "${SUMMARY_FILE}" != "" ]]; then
          {
            echo "- Reason: ref is not an eligible release tag"
            echo "- Ref: \`${REF}\`"
          } >> "${SUMMARY_FILE}"
        fi

        echo "::notice title=GitHub-Release: skipped::Ref is not an eligible release tag; skipping: ${REF}"


