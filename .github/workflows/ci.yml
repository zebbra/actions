name: CI

on:
  pull_request:
    paths:
      - '*/**'
      - '.github/workflows/**'
      - 'README.md'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  guard-docs:
    name: Guard generated docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for edits to generated files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "::group::Generated docs guard"
          printf 'Base SHA: %s\n' "$base"
          printf 'Head SHA: %s\n' "$head"
          files=$(git diff --name-only "$base" "$head" || true)
          if [ -z "${files:-}" ]; then
            echo "No changed files detected by git diff"
            echo "::endgroup::"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          bad=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == docs/* ]]; then
              echo "ERROR: Do not edit generated docs under docs/: $f" >&2
              bad=1
              continue
            fi
            if [[ "$f" == */README.md && "$f" != "README.md" ]]; then
              dir="${f%%/*}"
              if [ -f "$dir/action.yml" ]; then
                echo "ERROR: Do not edit generated action README: $f" >&2
                bad=1
              fi
            fi
          done <<<"$files"
          if printf '%s\n' "$files" | grep -qx 'README.md'; then
            if ! python3 - <<'PY'
          import subprocess, sys

          base = "${{ github.event.pull_request.base.sha }}"
          head = "${{ github.event.pull_request.head.sha }}"
          start = "<!-- LATEST_TAGS_START -->"
          end = "<!-- LATEST_TAGS_END -->"


          def read_at(ref: str, path: str) -> str:
              try:
                  return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)
              except subprocess.CalledProcessError:
                  return ""


          def extract_block(txt: str) -> str | None:
              if start not in txt or end not in txt:
                  return None
              after = txt.split(start, 1)[1]
              return after.split(end, 1)[0]


          a = extract_block(read_at(base, "README.md"))
          b = extract_block(read_at(head, "README.md"))

          if a is None or b is None:
              if a != b:
                  print(
                      "ERROR: Do not add/remove/modify the README.md LATEST_TAGS marker block (generated on release).",
                      file=sys.stderr,
                  )
                  raise SystemExit(2)
          else:
              if a != b:
                  print(
                      "ERROR: Do not modify README.md content between LATEST_TAGS_START/END (generated on release).",
                      file=sys.stderr,
                  )
                  raise SystemExit(2)
          PY
            then
              bad=1
            fi
          fi
          echo "::endgroup::"
          if [ "$bad" -ne 0 ]; then
            echo "Generated docs guard failed. Update sources (action.yml / DOCS.md); the release workflow regenerates docs/ and action READMEs." >&2
            exit 1
          fi

  test-and-validate:
    name: Test and validate actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed actions
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base="$GITHUB_SHA^"; head="$GITHUB_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          fi
          echo "::group::Changed files and actions"
          printf 'Base SHA: %s\n' "$base"
          printf 'Head SHA: %s\n' "$head"
          files=$(git diff --name-only "$base" "$head")
          if [ -n "${files}" ]; then
            printf 'Changed files:%s\n' ""
            printf '%s\n' "$files"
          else
            echo "No changed files detected by git diff"
          fi
          actions=$(find . -mindepth 2 -maxdepth 2 -type f -name action.yml -print0 | xargs -0 -r -n1 dirname | xargs -r -n1 basename | sort -u)
          changed=""
          for a in $actions; do
            if grep -qE "^${a}/" <<<"$files"; then
              changed="$changed $a"
            fi
          done
          changed=$(echo "$changed" | xargs -n1 | sort -u | paste -sd' ' -)
          printf 'Detected changed actions: %s\n' "${changed:-<none>}"
          echo "::endgroup::"
          echo "actions=$changed" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.changed.outputs.actions != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run action tests
        if: steps.changed.outputs.actions != ''
        shell: bash
        run: |
          set -euo pipefail
          for a in ${{ steps.changed.outputs.actions }}; do
            test_files=$(find "$a" -maxdepth 1 -name 'test_*.py' -o -name '*_test.py')
            if [ -z "$test_files" ]; then
              echo "No test files found for $a; skipping"
              continue
            fi
            echo "::group::Testing $a"
            pip install pytest
            if [ -f "$a/requirements.txt" ]; then
              pip install -r "$a/requirements.txt"
            fi
            pytest "$a" -v
            echo "::endgroup::"
          done

      - name: Validate composite action metadata
        if: steps.changed.outputs.actions != ''
        shell: bash
        run: |
          set -euo pipefail
          for a in ${{ steps.changed.outputs.actions }}; do
            file="$a/action.yml"
            if [ ! -f "$file" ]; then
              echo "Missing $file" >&2
              exit 1
            fi
            # Minimal schema presence checks for composite/docker actions
            if ! grep -q '^runs:' "$file"; then
              echo "Missing 'runs' in $file" >&2
              exit 1
            fi
            using_line=$(grep -m1 'using:' "$file" || true)
            if [ -z "$using_line" ]; then
              echo "Missing 'runs.using' in $file" >&2
              exit 1
            fi
            echo "Validated $file (runs.using: ${using_line#*: })"
          done

      - name: Build docker-based actions
        if: steps.changed.outputs.actions != ''
        shell: bash
        run: |
          set -euo pipefail
          for a in ${{ steps.changed.outputs.actions }}; do
            if [ -f "$a/Dockerfile" ]; then
              echo "Building Docker-based action: $a"
              docker build "$a" -t test/$a:ci
            else
              echo "Skipping docker build for $a (no Dockerfile)"
            fi
          done
